<svg width="360" height="150" viewBox="0 0 360 150" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="labelGrad" cx="35%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#ff5a4d"/>
      <stop offset="55%" stop-color="#b91c2c"/>
      <stop offset="100%" stop-color="#7a0f18"/>
    </radialGradient>
  </defs>

  <!-- card background -->
  <rect width="360" height="150" rx="20" fill="#0d1117" stroke="#30363d"/>

  <!-- barcode card: rectangular, softly rounded corners -->
  <rect x="20" y="12" width="34" height="116" rx="8" fill="#f5f5f5"/>
  <g fill="#111111">
    <rect x="32.5" y="20.0" width="9" height="2.2" rx="1.1"/>
    <rect x="28.5" y="25.3" width="17" height="2.2" rx="1.1"/>
    <rect x="34.0" y="30.7" width="6" height="2.2" rx="1.1"/>
    <rect x="27.5" y="36.0" width="19" height="2.2" rx="1.1"/>
    <rect x="31.5" y="41.3" width="11" height="2.2" rx="1.1"/>
    <rect x="29.5" y="46.7" width="15" height="2.2" rx="1.1"/>
    <rect x="33.5" y="52.0" width="7" height="2.2" rx="1.1"/>
    <rect x="28.5" y="57.3" width="17" height="2.2" rx="1.1"/>
    <rect x="32.0" y="62.7" width="10" height="2.2" rx="1.1"/>
    <rect x="30.5" y="68.0" width="13" height="2.2" rx="1.1"/>
    <rect x="34.0" y="73.3" width="6" height="2.2" rx="1.1"/>
    <rect x="28.0" y="78.7" width="18" height="2.2" rx="1.1"/>
    <rect x="32.5" y="84.0" width="9" height="2.2" rx="1.1"/>
    <rect x="30.5" y="89.3" width="13" height="2.2" rx="1.1"/>
    <rect x="29.0" y="94.7" width="16" height="2.2" rx="1.1"/>
    <rect x="33.5" y="100.0" width="7" height="2.2" rx="1.1"/>
  </g>
  <circle cx="37" cy="110" r="7" fill="#111111"/>
  <g fill="#f5f5f5">
    <rect x="34.0" y="107" width="1.4" height="6" rx="0.7"/>
    <rect x="36.6" y="105" width="1.4" height="10" rx="0.7"/>
    <rect x="39.2" y="108" width="1.4" height="4" rx="0.7"/>
  </g>

  <!-- turntable platter (static, peeks out behind the record) -->
  <circle cx="105" cy="71" r="40" fill="#161b22"/>

  <!-- vinyl record (spins) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 105 71" to="360 105 71" dur="3s" repeatCount="indefinite"/>
    <circle cx="105" cy="71" r="36" fill="#111111"/>
    <circle cx="105" cy="71" r="31" fill="none" stroke="#ffffff14" stroke-width="1"/>
    <circle cx="105" cy="71" r="26" fill="none" stroke="#ffffff14" stroke-width="1"/>
    <circle cx="105" cy="71" r="21" fill="none" stroke="#ffffff14" stroke-width="1"/>
    <circle cx="105" cy="71" r="16" fill="none" stroke="#ffffff14" stroke-width="1"/>
    <circle cx="105" cy="71" r="12" fill="url(#labelGrad)"/>
    <circle cx="105" cy="71" r="2.2" fill="#0d1117"/>
  </g>

  <!-- tonearm (static, rests on the edge) -->
  <circle cx="141" cy="20" r="3" fill="#8b949e"/>
  <line x1="141" y1="20" x2="126" y2="42" stroke="#8b949e" stroke-width="2" stroke-linecap="round"/>
  <circle cx="126" cy="42" r="2.5" fill="#e6edf3"/>

  <!-- text block: centered -->
  <text x="246" y="36" fill="#8b949e" font-family="Verdana, sans-serif" font-size="10" letter-spacing="1.5" text-anchor="middle">NOW PLAYING</text>
  <text x="246" y="62" fill="#ffffff" font-family="Verdana, sans-serif" font-size="23" font-weight="bold" text-anchor="middle">Pienso en Ella</text>
  <text x="246" y="86" fill="#9aa4b2" font-family="Verdana, sans-serif" font-size="15" text-anchor="middle">Natanael Cano</text>

  <!-- colorful visualizer bars: 13 bars, centered under the text, red to green -->
  <g>
    <rect x="170" y="118" width="8" height="14" rx="3" fill="#7a1a1a">
      <animate attributeName="height" values="14;20;10;14" dur="1.0s" repeatCount="indefinite"/>
      <animate attributeName="y" values="118;112;122;118" dur="1.0s" repeatCount="indefinite"/>
    </rect>
    <rect x="182" y="110" width="8" height="22" rx="3" fill="#a3232e">
      <animate attributeName="height" values="22;30;16;22" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="110;102;116;110" dur="1.2s" repeatCount="indefinite"/>
