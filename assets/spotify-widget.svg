<svg width="400" height="120" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="albumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1ED760"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <!-- card background -->
  <rect width="400" height="120" rx="16" fill="#0d1117" stroke="#30363d"/>

  <!-- album art -->
  <rect x="16" y="16" width="88" height="88" rx="12" fill="url(#albumGrad)"/>
  <g stroke="#0d1117" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.85">
    <circle cx="60" cy="60" r="18"/>
    <circle cx="60" cy="60" r="3" fill="#0d1117"/>
    <line x1="60" y1="42" x2="60" y2="48"/>
  </g>

  <!-- spotify-style icon -->
  <circle cx="132" cy="28" r="10" fill="#1ED760"/>
  <path d="M 126 25 Q 132 22 138 25" stroke="#0d1117" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <path d="M 125 28.5 Q 132 25 139 28.5" stroke="#0d1117" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <path d="M 126 32 Q 132 29.5 138 32" stroke="#0d1117" stroke-width="1.6" fill="none" stroke-linecap="round"/>

  <text x="148" y="32" fill="#8b949e" font-family="Verdana, sans-serif" font-size="11" letter-spacing="1.5">NOW PLAYING</text>

  <!-- equalizer bars -->
  <g transform="translate(354,16)">
    <rect x="0" y="6" width="3" height="8" fill="#1ED760">
      <animate attributeName="height" values="8;14;4;10;8" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="6;3;8;5;6" dur="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="6" y="2" width="3" height="16" fill="#1ED760">
      <animate attributeName="height" values="16;6;12;18;16" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="2;7;4;1;2" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="12" y="8" width="3" height="6" fill="#1ED760">
      <animate attributeName="height" values="6;16;8;4;6" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="8;2;6;10;8" dur="0.9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- track info -->
  <text x="120" y="64" fill="#e6edf3" font-family="Verdana, sans-serif" font-size="18" font-weight="bold">Pienso en Ella</text>
  <text x="120" y="86" fill="#8b949e" font-family="Verdana, sans-serif" font-size="13">Natanael Cano</text>

  <!-- progress bar -->
  <rect x="120" y="100" width="264" height="3" rx="1.5" fill="#30363d"/>
  <rect x="120" y="100" width="0" height="3" rx="1.5" fill="#1ED760">
    <animate attributeName="width" values="0;264;0" keyTimes="0;0.9;1" dur="14s" repeatCount="indefinite"/>
  </rect>
</svg>
