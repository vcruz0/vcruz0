    <rect x="278" y="100" width="8" height="32" rx="3" fill="#a9c956">
      <animate attributeName="height" values="32;24;36;32" dur="1.35s" repeatCount="indefinite"/>
      <animate attributeName="y" values="100;108;96;100" dur="1.35s" repeatCount="indefinite"/>
    </rect>
    <rect x="290" y="118" width="8" height="14" rx="3" fill="#90be6d">
      <animate attributeName="height" values="14;20;8;14" dur="0.95s" repeatCount="indefinite"/>
      <animate attributeName="y" values="118;112;124;118" dur="0.95s" repeatCount="indefinite"/>
    </rect>
    <rect x="302" y="108" width="8" height="24" rx="3" fill="#6a9b3f">
      <animate attributeName="height" values="24;16;28;24" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="108;116;104;108" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="314" y="120" width="8" height="12" rx="3" fill="#43aa8b">
      <animate attributeName="height" values="12;18;6;12" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="120;114;126;120" dur="0.9s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
