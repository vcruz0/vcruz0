      <animate attributeName="y" values="122;116;126;122" dur="0.85s" repeatCount="indefinite"/>
    </rect>
    <rect x="206" y="102" width="8" height="30" rx="3" fill="#e63946">
      <animate attributeName="height" values="30;22;36;30" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="102;110;96;102" dur="1.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="218" y="114" width="8" height="18" rx="3" fill="#f3722c">
      <animate attributeName="height" values="18;26;12;18" dur="1.05s" repeatCount="indefinite"/>
      <animate attributeName="y" values="114;106;120;114" dur="1.05s" repeatCount="indefinite"/>
    </rect>
    <rect x="230" y="96" width="8" height="36" rx="3" fill="#f8961e">
      <animate attributeName="height" values="36;28;40;36" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="96;104;92;96" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="242" y="106" width="8" height="26" rx="3" fill="#f9844a">
      <animate attributeName="height" values="26;18;32;26" dur="1.15s" repeatCount="indefinite"/>
      <animate attributeName="y" values="106;114;100;106" dur="1.15s" repeatCount="indefinite"/>
    </rect>
    <rect x="254" y="92" width="8" height="40" rx="3" fill="#f9c74f">
      <animate attributeName="height" values="40;32;40;36" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="92;100;92;96" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="266" y="112" width="8" height="20" rx="3" fill="#d4d66b">
      <animate attributeName="height" values="20;28;14;20" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="112;104;118;112" dur="1.1s" repeatCount="indefinite"/>
